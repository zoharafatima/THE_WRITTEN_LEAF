<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Create your personal reading space with The Written Leaf.">
	<title>Create an Account | The Written Leaf</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
	<header class="site-header"><a class="brand" href="index.html" aria-label="The Written Leaf home"><span class="brand-mark">&#10022;</span>The Written Leaf</a><button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button><nav class="site-nav" id="site-nav" aria-label="Main navigation"><a href="journey.html">Journey</a><a href="add-book.html">Add a book</a><a href="discover.html">Discover</a><a href="profile.html">Profile</a><a href="login.html">Sign in</a><a class="nav-link-arrow" href="lending.html">Lending &#8599;</a></nav></header>
	<main class="auth-main">
		<section class="auth-layout">
			<div class="auth-intro reveal">
				<p class="eyebrow"><span></span> A personal reading space</p>
				<h1>Make room<br><em>for what stays.</em></h1>
				<p>Keep the books, thoughts, and small discoveries that belong to your reading life.</p>
			</div>
			<form class="auth-form reveal">
				<div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
				<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
				<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required></div>
				<button class="button button-primary" type="submit">Create account <span>&#8599;</span></button>
				<p class="auth-note" aria-live="polite">Already have a place here? <a href="login.html">Log in</a></p>
				<p class="privacy-note">Your pages remain yours.</p>
			</form>
		</section>
	</main>
	<footer class="site-footer section-wrap auth-footer"><span class="footer-meta">&copy; 2024 / Made for readers</span></footer>
	<script src="js/script.js"></script>
</body>
</html>
